<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>backlog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="wordmark-row">
      <span><span class="wordmark">backlog</span><span class="version" id="version"></span></span>
    </div>
    <div class="repo-chip" id="repoChip" hidden>
      <span id="repoName"></span><span class="sep">/</span><span>.backlog</span><span class="sep">·</span><span class="branch" id="repoBranch"></span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="searchbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input class="input" id="queryInput" placeholder="title, description, tags">
    </div>
    <div class="seg seg-view" id="viewSeg">
      <label class="seg-opt"><input type="radio" name="view" value="list" checked>LIST</label>
      <label class="seg-opt"><input type="radio" name="view" value="board">BOARD</label>
    </div>
    <button class="btn btn-primary btn-capture" id="captureBtn">CAPTURE<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-group">
        <div class="side-heading">Status</div>
        <div class="side-list" id="statusList"></div>
      </div>
      <div class="side-group">
        <div class="side-heading">Priority <span class="note">— severity, not schedule</span></div>
        <div class="side-list" id="priorityList"></div>
      </div>
      <div class="side-group">
        <div class="side-heading">Tags</div>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>
    </aside>

    <main class="main">
      <div class="resultbar">
        <span class="result-count" id="resultCount"></span>
        <span class="result-note">descending priority, then ascending identifier</span>
        <div class="topbar-spacer"></div>
        <button class="btn btn-secondary" id="archiveToggle">Show archive · --all</button>
        <span class="result-cmd" id="resultCmd"></span>
      </div>

      <div id="listView">
        <table class="table">
          <colgroup>
            <col style="width:70px"><col class="col-priority" style="width:104px"><col><col class="col-tags" style="width:210px"><col class="col-status" style="width:110px">
          </colgroup>
          <thead><tr><th>ID</th><th>Priority</th><th>Title</th><th>Tags</th><th>Status</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
        <div class="empty-note" id="listEmpty" hidden>No task matches. An empty result is an answer, not a failure — <code>exit 0</code>.</div>
      </div>

      <div class="board" id="boardView" hidden></div>
    </main>
  </div>
</div>

<div class="dialog-backdrop" id="dialogBackdrop" hidden>
  <div class="dialog" id="dialog"></div>
</div>

<script src="app.js"></script>
</body>
</html>
